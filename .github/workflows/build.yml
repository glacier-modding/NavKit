name: CMake Build and Release

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  create_versioned_release:
    name: Create Versioned Release
    runs-on: ubuntu-latest
    needs: [ validate_build ]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'feat!:') ||
      startsWith(github.event.head_commit.message, 'feat:') ||
      startsWith(github.event.head_commit.message, 'fix:'))
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version and prepare release notes
        id: release
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tempfile

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          tags = git("tag", "--list", "v[0-9]*.*.*", "--sort=-version:refname").splitlines()
          if not tags:
              raise SystemExit("No previous version tag found; cannot calculate the next version.")

          previous_tag = tags[0]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", previous_tag)
          if not match:
              raise SystemExit(f"Latest tag is not a supported semantic version: {previous_tag}")
          major, minor, patch = map(int, match.groups())

          subject = os.environ["COMMIT_SUBJECT"]
          if subject.startswith("feat!:"):
              major, minor, patch = major + 1, 0, 0
          elif subject.startswith("feat:"):
              minor, patch = minor + 1, 0
          elif subject.startswith("fix:"):
              patch += 1
          else:
              raise SystemExit(f"Unsupported release commit: {subject}")

          tag = f"v{major}.{minor}.{patch}"
          cmake_path = "CMakeLists.txt"
          cmake = open(cmake_path, encoding="utf-8").read()
          cmake, count = re.subn(
              r"(VERSION\s+)\d+\.\d+\.\d+",
              rf"\g<1>{major}.{minor}.{patch}",
              cmake,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the project version in CMakeLists.txt.")
          open(cmake_path, "w", encoding="utf-8", newline="").write(cmake)

          config_path = "include/NavKit/NavKitConfig.h"
          config = open(config_path, encoding="utf-8").read()
          for component, value in (
              ("MAJOR", major),
              ("MINOR", minor),
              ("PATCH", patch),
          ):
              config, count = re.subn(
                  rf'(#define NavKit_VERSION_{component} ")[^"]+(")',
                  rf"\g<1>{value}\g<2>",
                  config,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update {component} in {config_path}.")
          open(config_path, "w", encoding="utf-8", newline="").write(config)

          subjects = git("log", "--format=%s", f"{previous_tag}..HEAD").splitlines()
          enhancements = []
          fixes = []
          other = []
          conventional = re.compile(r"^(feat|fix)(?:\([^)]*\))?!?:\s*(.+)$")
          for message in subjects:
              parsed = conventional.match(message)
              if parsed:
                  entry = parsed.group(2)
                  (fixes if parsed.group(1) == "fix" else enhancements).append(entry)
              else:
                  other.append(message)

          notes = [f"# NavKit {tag}", "", "## Enhancements"]
          notes.extend(f"- {entry}" for entry in enhancements)
          notes.extend(["", "## Fixes"])
          notes.extend(f"- {entry}" for entry in fixes)
          if other:
              notes.extend(["", "## Other Changes"])
              notes.extend(f"- {entry}" for entry in other)
          notes.extend([
              "",
              f"Full Changelog: https://github.com/glacier-modding/NavKit/compare/{previous_tag}...{tag}",
              "",
              "_Note: As of the time of this release you will need to use at least this version of the ZHMModSDK:_",
              "https://github.com/OrfeasZ/ZHMModSDK/actions/runs/34685865082",
              "",
          ])

          notes_path = os.path.join(tempfile.gettempdir(), "release-notes.md")
          with open(notes_path, "w", encoding="utf-8", newline="\n") as release_notes:
              release_notes.write("\n".join(notes))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"previous_tag={previous_tag}\n")
              output.write(f"notes_path={notes_path}\n")
          PY

      - name: Commit version, tag, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt include/NavKit/NavKitConfig.h
          git commit -m "chore: release ${{ steps.release.outputs.tag }}"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "${{ steps.release.outputs.tag }}"
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "NavKit ${{ steps.release.outputs.tag }}" \
            --notes-file "${{ steps.release.outputs.notes_path }}"
          gh workflow run build.yml --ref "${{ steps.release.outputs.tag }}"

  validate_build:
    name: Validate Build
    runs-on: windows-2022
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"
      VCPKG_CACHE_DIR: ${{ github.workspace }}\vcpkg_cache

    strategy:
      matrix:
        config: [ debug, release ]
    steps:
      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.30.0"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_CACHE_DIR }}
            build/*/vcpkg_installed/
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
            
      - name: Create vcpkg cache directory
        shell: pwsh
        run: New-Item -Path "${{ env.VCPKG_CACHE_DIR }}" -ItemType Directory -Force

      - name: Build ${{ matrix.config }}
        run: |
          cmake --preset x64-${{ matrix.config }} -D BUILD_TESTING=ON
          cmake --build --preset x64-${{ matrix.config }} -j12
          ctest --test-dir build/x64-${{ matrix.config }} -C ${{ matrix.config == 'debug' && 'Debug' || 'Release' }} --output-on-failure

      - name: Upload Release Build Artifact
        if: matrix.config == 'release' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: build/x64-release/

  validate_macos:
    name: Validate universal macOS build
    runs-on: macos-15
    # Keep macOS validation advisory until the universal dependency build is fixed.
    continue-on-error: true
    outputs:
      artifact_uploaded: ${{ steps.upload_artifact.outcome == 'success' }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
      VCPKG_CACHE_DIR: ${{ github.workspace }}/vcpkg_cache
    steps:
      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.30.0"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_CACHE_DIR }}
            build/macos-release/vcpkg_installed/
          key: vcpkg-${{ runner.os }}-universal-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json', 'triplets/arm64-universal-osx.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-universal-

      - name: Create vcpkg cache directory
        run: mkdir -p "${VCPKG_CACHE_DIR}"

      - name: Verify navkit-rpkg-lib universal binaries
        run: |
          lipo lib/Debug/libnavkit_rpkg_lib.dylib -verify_arch arm64 x86_64
          lipo lib/Release/libnavkit_rpkg_lib.dylib -verify_arch arm64 x86_64

      - name: Build universal macOS release
        run: |
          cmake --preset macos-release -D BUILD_TESTING=ON
          cmake --build --preset macos-release --parallel 4
          ctest --test-dir build/macos-release --output-on-failure
          cmake --install build/macos-release --prefix "${GITHUB_WORKSPACE}/build/macos-stage"

      - name: Verify universal app binaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          app = Path("build/macos-stage/NavKit.app")
          binaries = []
          for path in app.rglob("*"):
              if not path.is_file():
                  continue
              description = subprocess.check_output(
                  ["file", "-b", str(path)], text=True
              )
              if "Mach-O" in description:
                  subprocess.run(
                      ["lipo", str(path), "-verify_arch", "arm64", "x86_64"],
                      check=True,
                  )
                  binaries.append(path)

          if not binaries:
              raise SystemExit(f"No Mach-O binaries found in {app}")
          print(f"Verified {len(binaries)} universal Mach-O binaries.")
          PY

      - name: Package app bundle
        run: |
          hdiutil create -volname NavKit \
            -srcfolder build/macos-stage/NavKit.app \
            -ov -format UDZO \
            "build/NavKit-macos-universal.dmg"

      - name: Upload macOS release artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/NavKit-macos-universal.dmg

  create_release:
    name: Create Release with MSI
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"
      VCPKG_CACHE_DIR: ${{ github.workspace }}\vcpkg_cache

    needs: [ validate_build ]

    permissions:
      contents: write

    steps:
      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.30.0"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_CACHE_DIR }}
            build/*/vcpkg_installed/
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Create vcpkg cache directory
        shell: pwsh
        run: New-Item -Path "${{ env.VCPKG_CACHE_DIR }}" -ItemType Directory -Force

      - name: Install WiX v6 Toolset from MSI
        shell: pwsh
        run: |
          $wix_version = "6.0.2"
          $msi_url = "https://github.com/wixtoolset/wix/releases/download/v${wix_version}/wix-cli-x64.msi"
          $msi_path = "wix.msi"
          
          Write-Host "Downloading WiX v$($wix_version) from $msi_url"
          Invoke-WebRequest -Uri $msi_url -OutFile $msi_path
          
          Write-Host "Installing WiX from $msi_path..."
          Start-Process msiexec.exe -ArgumentList "/i `"$msi_path`" /quiet" -Wait

      - name: Download Release Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: build/x64-release/

      - name: Configure and Build Installer
        shell: pwsh
        run: |
          cmake --preset x64-release -D BUILD_INSTALLER=ON
          Write-Host "Starting the installer build..."
          cmake --build build/x64-release --target installer --config Release

      - name: Upload MSI to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/x64-release/NavKit.msi
          asset_name: NavKit.msi
          tag: ${{ github.ref }}
          overwrite: true

  create_macos_release:
    name: Add universal macOS build to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.validate_macos.outputs.artifact_uploaded == 'true'
    needs: [ validate_macos, create_release ]
    permissions:
      contents: write
    steps:
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: build/macos-release/
          merge-multiple: true

      - name: Upload universal macOS build to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/macos-release/NavKit-macos-universal.dmg --clobber
